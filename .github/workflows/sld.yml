name: SLD Governance

# Seven Layer Dip runtime governance checks. Runs the deterministic engine's
# unit tests, then evaluates the change's diff against the baseline. The change
# analysis fails the job ONLY on a BLOCK decision (forbidden term, destructive
# DB op, architecture violation, duplicate app root, massive content loss) —
# REVIEW_REQUIRED and ALLOW_WITH_WARNING are surfaced as advisory output so
# legitimate changes are never gated on a human-review nudge. Insufficient
# evidence fails closed.
#
# The report is posted as a PR comment so REVIEW_REQUIRED findings reach human
# eyes instead of living only in the workflow log.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  sld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need history to diff against the base ref
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci

      - name: SLD engine tests
        run: npm run sld:test

      # Resolve the diff base. On pull_request this is the base branch. On a
      # direct push to main it is the pre-push commit: diffing origin/main
      # against HEAD after checkout compares a commit to itself (empty diff),
      # which previously let pushed changes bypass analysis entirely.
      - name: Resolve diff base ref
        id: baseref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1 || true
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              # New branch or force-push: fall back to the first parent.
              echo "ref=${{ github.sha }}^" >> "$GITHUB_OUTPUT"
            else
              echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Scope enforcement needs the TaskContract that authorized the branch.
      # Without .sld/task-contract.json every change is unauthorized, which is
      # correct for an agent but wrong for a human PR, so the gate only runs the
      # scope check when a contract is present.
      - name: SLD post-change scope verification (when a TaskContract is present)
        run: |
          if [ -f .sld/task-contract.json ]; then
            node scripts/sld.mjs verify "${{ steps.baseref.outputs.ref }}"
          else
            echo "No TaskContract on this branch — skipping scope verification."
          fi

      - name: SLD change analysis (BLOCK or insufficient evidence fails the job)
        run: |
          set +e
          node scripts/sld.mjs check "${{ steps.baseref.outputs.ref }}" > "${RUNNER_TEMP}/sld-report.txt"
          code=$?
          set -e
          cat "${RUNNER_TEMP}/sld-report.txt"
          echo "SLD exit code: $code"
          if [ "$code" = "2" ]; then
            echo "::error::SLD cannot permit this change — BLOCK or INSUFFICIENT_EVIDENCE."
            exit 1
          fi
          if [ "$code" = "1" ]; then
            echo "::warning::SLD returned REVIEW_REQUIRED — human review recommended (not blocking)."
          fi
          exit 0

      - name: Post SLD report as PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## SLD governance report"
            echo ""
            echo "Change inspected by the Seven Layer Dip engine before merge."
            echo "Green means clean, yellow means a human should look, red means stopped."
            echo ""
            echo '```'
            sed -r 's/\x1b\[[0-9;]*m//g' "${RUNNER_TEMP}/sld-report.txt"
            echo '```'
          } > "${RUNNER_TEMP}/sld-comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "${RUNNER_TEMP}/sld-comment.md"

